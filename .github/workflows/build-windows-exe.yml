name: Build & Release Karobar-App (.exe)

on:
  push:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      app_version:
        description: "Optional Custom Version (leave 'auto' for 2.0.<build_number>)"
        required: false
        default: "auto"

jobs:
  build-windows-exe:
    name: Compile & Release Karobar-App-Setup.exe (Win64)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup PHP 8.4 (with sodium, sqlite, gd, zip)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, sodium, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Production Composer Dependencies
        shell: pwsh
        run: |
          php -v
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build Windows Desktop Shell & Inno Setup .exe Installer
        shell: pwsh
        env:
          KAROBAR_APP_VERSION: ${{ inputs.app_version }}
        run: ./scripts/build-windows-exe.ps1

      - name: Attest Build Provenance to GitHub (shzdasim/Karobar-App)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "dist/installer/*.exe"

      - name: Upload Karobar-App-Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karobar-App-Setup-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.zip
            dist/installer/*.cer
            dist/installer/*.bat
            dist/installer/latest-release.json
          retention-days: 30

      - name: Publish Official GitHub Release & OTA Update Manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Manifest = Get-Content "dist/installer/latest-release.json" -Raw | ConvertFrom-Json
          $AppVersion = $Manifest.version
          $BuildNumber = $Manifest.build_number
          $ReleaseTag = "v$AppVersion"
          $ReleaseTitle = "Karobar-App v$AppVersion (Build #$BuildNumber) — Windows 64-Bit Desktop Edition"
          $BundleZip = "dist/installer/Karobar-App-Setup-Bundle.zip"
          if (Test-Path $BundleZip) { Remove-Item -Force $BundleZip }

          Compress-Archive -Path `
              "dist/installer/Karobar-App-Setup.exe", `
              "dist/installer/MalikAsimShahzad-KarobarERP.cer", `
              "dist/installer/Install-Karobar-App.bat" `
              -DestinationPath $BundleZip -Force

          $RecentChanges = $Manifest.notes
          $ReleaseNotes = @"
          ## Karobar-App v$AppVersion (Build #$BuildNumber — Windows 64-Bit Standalone `.exe`)
          **Author & Developer:** Malik Asim Shahzad ([@shzdasim](https://github.com/shzdasim))

          ### What's New in Build #$BuildNumber
          $RecentChanges

          ### Key Capabilities
          - **Differential Fast In-Place OTA Updates (~2-5 MB)**: Karobar-App now downloads only updated application code and compiled assets instead of the entire ~275 MB installer, updating in 1–2 seconds with 100% Zero Data Loss.
          - **In-App Over-The-Air (OTA) Updates with 100% Zero Data Loss**: Installed copies of `Karobar-App` automatically detect this release when connected to the internet and offer a 1-click **"Update & Restart Now"** upgrade that backs up and preserves 100% of your SQLite database, invoices, products, ledgers, users, WhatsApp session, and license.
          - **Existing Herd SQLite Database Import**: Import an existing Laravel Herd `database.sqlite` file during installation (clears only old users & old license records while keeping 100% of business data intact).
          - **Hardware-Bound Ed25519 Licensing (`KRB-XXXX-XXXX-XXXX-XXXX`)**: Single-machine cryptographic binding with 1-click Machine ID copy.
          - **Windows Native Top Menu Bar + Chrome-Style Top Browser Tabs**: Open multiple live workspace tabs (Sales, Purchases, POS, Ledgers) simultaneously with `Ctrl+Tab` / `Ctrl+Shift+Tab` switching and `Ctrl+Shift+A` tab search.

          ### Installation / Manual Update Instructions
          - **Existing Users**: Simply open `Karobar-App` while connected to the internet and click **"Update & Restart Now"** on the update notification!
          - **New Installations**: Download **`Karobar-App-Setup-Bundle.zip`**, extract it, and run **`Install-Karobar-App.bat`** (or run **`Karobar-App-Setup.exe`** directly).
          "@

          $NotesFile = "dist/installer/release-notes.md"
          Set-Content -Path $NotesFile -Value $ReleaseNotes -Encoding UTF8

          git tag -f $ReleaseTag $env:GITHUB_SHA
          git push origin "refs/tags/$ReleaseTag" --force

          gh release view $ReleaseTag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Updating existing GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release edit $ReleaseTag --title $ReleaseTitle --notes-file $NotesFile --latest
              gh release upload $ReleaseTag `
                  "dist/installer/Karobar-App-Setup.exe" `
                  "dist/installer/Karobar-App-Patch.zip" `
                  "dist/installer/Karobar-App-Setup-Bundle.zip" `
                  "dist/installer/latest-release.json" `
                  "dist/installer/MalikAsimShahzad-KarobarERP.cer" `
                  "dist/installer/Install-Karobar-App.bat" `
                  --clobber
          } else {
              Write-Host "Creating new GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release create $ReleaseTag `
                  "dist/installer/Karobar-App-Setup.exe" `
                  "dist/installer/Karobar-App-Patch.zip" `
                  "dist/installer/Karobar-App-Setup-Bundle.zip" `
                  "dist/installer/latest-release.json" `
                  "dist/installer/MalikAsimShahzad-KarobarERP.cer" `
                  "dist/installer/Install-Karobar-App.bat" `
                  --title $ReleaseTitle `
                  --notes-file $NotesFile `
                  --latest
          }
