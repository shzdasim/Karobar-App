name: Build & Release Karobar-App (.exe & Linux Server Bundle)

on:
  push:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      app_version:
        description: "Optional Custom Version (leave 'auto' for 2.0.<build_number>)"
        required: false
        default: "auto"

jobs:
  build-windows-exe:
    name: Compile & Release Karobar-App-Setup.exe (Win64)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup PHP 8.4 (with sodium, sqlite, gd, zip)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, sodium, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Production Composer Dependencies
        shell: pwsh
        run: |
          php -v
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build Windows Desktop Shell & Inno Setup .exe Installer
        shell: pwsh
        env:
          KAROBAR_APP_VERSION: ${{ inputs.app_version }}
        run: ./scripts/build-windows-exe.ps1

      - name: Attest Build Provenance to GitHub (shzdasim/Karobar-App)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "dist/installer/*.exe"

      - name: Upload Karobar-App-Setup.exe & Linux Server Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karobar-App-Setup-Installer
          path: |
            dist/installer/*.exe
            dist/installer/*.run
            dist/installer/*.sh
            dist/installer/*.html
            dist/installer/*.zip
            dist/installer/*.cer
            dist/installer/*.bat
            dist/installer/latest-release.json
          retention-days: 30

      - name: Publish Official GitHub Release & OTA Update Manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Manifest = Get-Content "dist/installer/latest-release.json" -Raw | ConvertFrom-Json
          $AppVersion = $Manifest.version
          $BuildNumber = $Manifest.build_number
          $ReleaseTag = "v$AppVersion"
          $ReleaseTitle = "Karobar-App v$AppVersion (Build #$BuildNumber)"
          $BundleZip = "dist/installer/Karobar-App-Setup-Bundle.zip"
          if (Test-Path $BundleZip) { Remove-Item -Force $BundleZip }

          $BundleItems = @(
              "dist/installer/Karobar-App-Setup.exe",
              "dist/installer/karobar-linux-server-installer.run",
              "dist/installer/karobar-server-setup.sh",
              "dist/installer/Multi-PC-Server-Guide.html",
              "dist/installer/MalikAsimShahzad-KarobarERP.cer",
              "dist/installer/Install-Karobar-App.bat"
          ) | Where-Object { Test-Path $_ }

          Compress-Archive -Path $BundleItems -DestinationPath $BundleZip -Force

          $RecentChanges = $Manifest.notes
          $ReleaseNotes = @"
          ## Karobar-App v$AppVersion (Build #$BuildNumber)
          **Author & Developer:** Malik Asim Shahzad ([@shzdasim](https://github.com/shzdasim))

          ### Unified Single-PC & Multi-PC Release (`Karobar-App-Setup-Bundle.zip`)
          - **For Existing 1-PC Standalone Customers:** Click **Update** inside Karobar-App (`Karobar-App-Patch.zip`) or run `Karobar-App-Setup.exe` for a **100% Zero-Data-Loss In-Place Update** (preserves all local SQLite data, users, license, invoice numbers, and settings).
          - **For New 1-PC Standalone Stores:** Run **`Karobar-App-Setup.exe`** (Standalone 1-PC SQLite mode is selected by default).
          - **For Multi-PC Stores (Linux Server + Windows POS Counter Terminals):**
            1. **Linux Store Server PC:** Run `sudo bash karobar-linux-server-installer.run` (sets up MariaDB 10.11 LTS InnoDB + Redis + PHP-FPM + Nginx + Avahi `.local` and launches `/server-dashboard`).
            2. **Windows Counter PCs:** Run `Karobar-App-Setup.exe` and select **Multi-PC POS Terminal Mode** (or switch anytime in **Settings → Server & Terminals**).
            3. **Documentation:** Open `Multi-PC-Server-Guide.html` in any browser for the visual guide.

          ### What's New in Build #$BuildNumber
          $RecentChanges
          "@

          $NotesFile = "dist/installer/release-notes.md"
          Set-Content -Path $NotesFile -Value $ReleaseNotes -Encoding UTF8

          # Clean up any temporary v3.0.* or multi-pc-v3.0.* test releases so only the unified v2.0.x release stream exists
          $AllTags = gh release list --limit 30 --json tagName --jq '.[].tagName'
          foreach ($t in $AllTags) {
              if ($t -match '^(multi-pc-)?v3\.0\.') {
                  Write-Host "Cleaning up temporary test release $t..." -ForegroundColor Yellow
                  gh release delete $t --yes --cleanup-tag
              }
          }

          git tag -f $ReleaseTag $env:GITHUB_SHA
          git push origin "refs/tags/$ReleaseTag" --force

          $ReleaseAssets = @(
              "dist/installer/Karobar-App-Setup.exe",
              "dist/installer/Karobar-App-Patch.zip",
              "dist/installer/Karobar-App-Setup-Bundle.zip",
              "dist/installer/karobar-linux-server-installer.run",
              "dist/installer/karobar-server-setup.sh",
              "dist/installer/Multi-PC-Server-Guide.html",
              "dist/installer/latest-release.json",
              "dist/installer/MalikAsimShahzad-KarobarERP.cer",
              "dist/installer/Install-Karobar-App.bat"
          ) | Where-Object { Test-Path $_ }

          gh release view $ReleaseTag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Updating existing GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release edit $ReleaseTag --title $ReleaseTitle --notes-file $NotesFile --latest
              gh release upload $ReleaseTag $ReleaseAssets --clobber
          } else {
              Write-Host "Creating new GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release create $ReleaseTag $ReleaseAssets `
                  --title $ReleaseTitle `
                  --notes-file $NotesFile `
                  --latest
          }
