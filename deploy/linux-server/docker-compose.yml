services:
  karobar-app:
    build:
      context: ../..
      dockerfile: deploy/linux-server/Dockerfile
    container_name: karobar-app
    restart: unless-stopped
    ports:
      - "${KAROBAR_PORT:-8000}:8000"
    environment:
      APP_NAME: "Karobar-App ERP"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-karobar_erp}
      DB_USERNAME: ${DB_USERNAME:-karobar}
      DB_PASSWORD: ${DB_PASSWORD:-karobar_secret_2026}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_AGENT_URL: "http://whatsapp-agent:18955"
    volumes:
      - karobar_storage:/opt/karobar-server/storage
      # Bind-mount the physical Linux host's /etc/machine-id so hardware-bound Ed25519 licenses remain stable across container rebuilds
      - /etc/machine-id:/etc/host-machine-id:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  mariadb:
    image: mariadb:10.11
    container_name: karobar-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-karobar_root_secret_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-karobar_erp}
      MARIADB_USER: ${DB_USERNAME:-karobar}
      MARIADB_PASSWORD: ${DB_PASSWORD:-karobar_secret_2026}
    volumes:
      - karobar_mariadb:/var/lib/mysql
      - ./mariadb/99-karobar-innodb.cnf:/etc/mysql/conf.d/99-karobar-innodb.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: karobar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - karobar_redis:/data

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/linux-server/Dockerfile
    container_name: karobar-scheduler
    restart: unless-stopped
    command: ["php", "/opt/karobar-server/artisan", "schedule:work"]
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-karobar_erp}
      DB_USERNAME: ${DB_USERNAME:-karobar}
      DB_PASSWORD: ${DB_PASSWORD:-karobar_secret_2026}
      CACHE_STORE: redis
      REDIS_HOST: redis
    volumes:
      - karobar_storage:/opt/karobar-server/storage
      - /etc/machine-id:/etc/host-machine-id:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  whatsapp-agent:
    build:
      context: ../..
      dockerfile: deploy/linux-server/Dockerfile
    container_name: karobar-whatsapp
    restart: unless-stopped
    command: ["node", "/opt/karobar-server/scripts/whatsapp-agent.mjs"]
    environment:
      WHATSAPP_AGENT_PORT: 18955
      WHATSAPP_AUTH_DIR: /opt/karobar-server/storage/app/whatsapp-auth
    volumes:
      - karobar_storage:/opt/karobar-server/storage

volumes:
  karobar_storage:
  karobar_mariadb:
  karobar_redis:
